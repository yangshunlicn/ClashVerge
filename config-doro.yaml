# ══════════════════════════════════════════════════════════════
# Mihomo 进阶配置 
# ══════════════════════════════════════════════════════════════


# ══ 全局 ══════════════════════════════════════════════
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: true
find-process-mode: strict
unified-delay: true            # 统一延迟：用实际往返时间，比握手时间更准
tcp-concurrent: true           # TCP 并发建连：选最快的 IP
global-client-fingerprint: chrome
keep-alive-interval: 30        # TCP keepalive 探测间隔（秒）
keep-alive-idle: 600           # TCP keepalive 空闲等待时间（秒）
global-ua: clash-verge/v2.4.7  # 在下载外部资源时(机场订阅)使用的 UA 值

### 如果使用的是裸核，需要将下面的注释去掉，方便ui界面的使用
# external-controller: 127.0.0.1:9090
# external-ui: ui
# external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
# secret: "your_strong_password"

# ── 锚点统一管理 ──────────────────
# 订阅提供者锚点
p: &p
  type: http
  interval: 86400
  proxy: DIRECT
  header:
    User-Agent:
      - "clash-verge/v2.4.7"
  health-check:
    enable: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    lazy: true
#  filter: "^(?!.*(剩余|到期|官网|免费|试用|套餐|重置|过期|流量|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$"

# ── 代理提供者 ────────────────────────────────────────────────
proxy-providers:
  Doro:
    <<: *p
    url: "https://sub.dorocloud.xyz/doro/5f9f4a7c80cbcb4223ad4a12188dc67d"
    path: ./proxy_providers/airport-doro5.yaml  # 注意：每个 provider 要有不同的 path！

# ── 配置持久化 ────────────────────────────────────────────────────────
profile:
  store-selected: true
  store-fake-ip: true

# ── GeoData 数据库加载优化 ────────────────────────────────────────────────────────
geodata-mode: true
geodata-loader: memconservative  # 内存节省模式（路由器/内存小的设备推荐）
                                 # standard：性能更高，内存占用也更多
geosite-matcher: succinct        # succinct（精简）/ mph（哈希，速度最快）

# ── GeoData 数据库地址 ────────────────────────────────────────────────────────
geox-url:
  geoip:   "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb:    "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# ── 通过 Network Time Protocol协议 校准系统时间 ────────────────────────────────────────────────────────
ntp:
  enable: true
  write-to-system: true

# ── TUN ────────────────────────────────────────────────────────
tun:
  enable: true
  stack: mixed              # 协议栈：mixed（推荐）/ system / gvisor / mips
                            # system：速度最快，兼容性最好，内存最低
                            # gvisor：用户态网络栈，UDP 支持更好，但性能略低
                            # mixed：TCP 走 system，UDP 走 gvisor，均衡之选
  device: mihomo            # 虚拟网卡名称（可自定义，Linux 下常见 tun0）
  dns-hijack:
    - "any:53"              # 劫持所有发往 53 端口的 DNS 请求
    - "tcp://any:53"        # 同时劫持 TCP 的 DNS
  auto-detect-interface: true   # 自动识别出口网卡（推荐）
  auto-route: true              # 自动配置系统路由表（TUN 接管全流量的关键）
  strict-route: true            # 严格路由：防止流量绕过 TUN（会影响某些 VPN 场景）
  mtu: 1500                     # MTU，适当提高减少分片（以太网推荐 1500，虚拟网络可更高）

  # 以下 IP 段排除在 TUN 之外（直接走本机网络）
  route-exclude-address:
    - "192.168.0.0/16"
    - "10.0.0.0/8"

# ── 嗅探 ──────────────────────────────────────────────────────
sniffer:
  enable: true
  sniff:
    HTTP:  { ports: [80, 8080-8880], override-destination: true }
    TLS:   { ports: [443, 8443] }
    QUIC:  { ports: [443, 8443] }
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ── DNS ────────────────────────────────────────────────────────
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: true
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true          # DNS 解析遵守路由规则：代理域名走代理侧解析
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "connect.rom.miui.com"
    - "+.miwifi.com"
    - "+.ntp.org"
    - "+.u-tools.cn"
    - "+.mediatek.com"
    - "+.cfprefer1.xyz"
    - "+.wetab.link"
    - "+.tyasaka.xyz"
    # QQ
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    # WeChat
    - "localhost.work.weixin.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    # Windows
    - "time.windows.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.wpsmail.net"
    - "+.henzanapp.com"
    - "+.pconline.com.cn"


  # 用于解析 DNS 服务器自身的域名
  default-nameserver:
      - 223.5.5.5

# 用于解析机场代理节点域名的 NDS 服务器
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 用于 DIRECT 出口域名解析的 DNS 服务器
  direct-nameserver:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

  # nameserver-policy： DNS分流
  nameserver-policy:
    # 国内域名走国内 DNS，解析结果最准确
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    # 国外域名走国外 DNS（配合 respect-rules 会走代理）
    "geosite:geolocation-!cn":
      - "tls://8.8.8.8"
      - "tls://1.1.1.1"

  # 默认DNS服务器（nameserver-policy 未覆盖的域名走这里）
  nameserver:
      - "tls://8.8.8.8"
      - "tls://1.1.1.1"

# 规则集类型锚点
rs_classical_yaml: &rs_classical_yaml { type: http, behavior: classical, interval: 43200, format: yaml }
rs_classical: &rs_classical { type: http, behavior: classical, interval: 43200, format: text }
rs_domain:    &rs_domain    { type: http, behavior: domain,    interval: 43200, format: text }
rs_ipcidr:    &rs_ipcidr    { type: http, behavior: ipcidr,    interval: 43200, format: text }
# 代理组类型锚点
g_select:   &g_select   { type: select,       url: "https://www.gstatic.com/generate_204", include-all: true }
g_urltest:  &g_urltest  { type: url-test,     url: "https://www.gstatic.com/generate_204", interval: 300, lazy: true, tolerance: 50, timeout: 2000, max-failed-times: 3, include-all: true, hidden: false }
g_fallback: &g_fallback { type: fallback,     url: "https://www.gstatic.com/generate_204", interval: 300, lazy: true, timeout: 2000, max-failed-times: 3, include-all: true, hidden: false }
g_balance:  &g_balance  { type: load-balance, url: "https://www.gstatic.com/generate_204", interval: 300, lazy: true, timeout: 2000, strategy: consistent-hashing, max-failed-times: 3, include-all: true, hidden: false }
# 正则表达式锚点(节点筛选)
FilterHK: &FilterHK '^(?=.*(🇭🇰|香港|HK|Hong Kong))(?!.*(回国|校园|游戏|剩余|到期|官网|客服|订阅|节点|过期|时间)).*$'
FilterTW: &FilterTW '^(?=.*(🇹🇼|台|TW|Taiwan))(?!.*(回国|校园|游戏|剩余|到期|官网|客服|订阅|节点|过期|时间)).*$'
FilterJP: &FilterJP '^(?=.*(🇯🇵|日|JP|Japan|Tokyo|Osaka))(?!.*(回国|校园|游戏|剩余|到期|官网|客服|订阅|节点|过期|时间)).*$'
FilterSG: &FilterSG '^(?=.*(🇸🇬|新|SG|Singapore))(?!.*(回国|校园|游戏|剩余|到期|官网|客服|订阅|节点|过期|时间)).*$'
FilterUS: &FilterUS '^(?=.*(🇺🇸|美|US|United States|Los Angeles|Silicon|Seattle))(?!.*(回国|校园|游戏|剩余|到期|官网|客服|订阅|节点|过期|时间)).*$'
FilterKR: &FilterKR '^(?=.*(🇰🇷|韩|KR|Korea))(?!.*(回国|校园|游戏|剩余|到期|官网|客服|订阅|节点|过期|时间)).*$'
# Doro机场专用正则
FilterDoro_Relay: &FilterDoro_Relay '^(?=.*(?i)(中转|中繼|中继|转发|Relay|Transit))(?!.*(?i)(专线|IEPL|IPLC|CN2GIA|CU9929|9929|官网|客服|订阅|套餐|流量|剩余|到期|过期|公告|通知|群|频道|邀请|返利|工单|邮箱|测试)).*$'
FilterDoro_Premium: &FilterDoro_Premium '^(?=.*(?i)(专线|IEPL|IPLC|CN2GIA|CN2\s*GIA|CU9929|9929|精品网))(?!.*(?i)(官网|客服|订阅|套餐|流量|剩余|到期|过期|公告|通知|群|频道|邀请|返利|工单|邮箱|测试)).*$'
FilterDoro_ISP: &FilterDoro_ISP '^(?=.*(?:🇯🇵|日本|(?i:Japan)|\b(?i:JP)\b|🇸🇬|新加坡|(?i:Singapore)|\b(?i:SG)\b|🇺🇸|美国|(?i:America)|\b(?i:USA?)\b|🇲🇾|马来西亚|(?i:Malaysia)|\b(?i:MY)\b|🇵🇭|菲律宾|(?i:Philippines)|\b(?i:PH)\b|🇹🇼|台湾|台灣|(?i:Taiwan)|\b(?i:TW)\b))(?=.*(?:专线|专用线路|(?i:IPLC|IEPL|Dedicated)))(?=.*(?i:ISP|双ISP|家宽|住宅|Residential|Home|Broadband|宽带|AT&T|Comcast|Spectrum|Verizon|Cox|Xfinity|Charter|T-Mobile|StarHub|Singtel|M1|ViewQwest|NTT|SoftBank|KDDI|\bau\b|OCN|BIGLOBE|So-net|J:COM|Hinet|广港专线)).*$'
FilterDoro_Hosting: &FilterDoro_Hosting '^(?!.*(?:专线|专用线路|(?i:IPLC|IEPL|Dedicated)|家宽|(?i:ISP)))(?=.*(?:🇭🇰|香港|(?i:Hong\s?Kong)|\b(?i:HK)\b|🇯🇵|日本|(?i:Japan)|\b(?i:JP)\b|🇸🇬|新加坡|(?i:Singapore)|\b(?i:SG)\b)).*$'

# ── 代理组 ────────────────────────────────────────────────────
proxy-groups:
  # ── 顶层入口 ────────────────────────────────────────────────
  - name: "🎯 节点选择"
    type: select
    proxies: ["🇭🇰 香港", "🇸🇬 新加坡", "🇯🇵 日本", "🇺🇸 美国", "🇹🇼 台湾", "🇰🇷 韩国"]
    include-all: true

  # ── 功能性分组（指向具体地区）─────────────────────────────────
  - name: "🤖 Claude 服务"
    type: select
    proxies: ["🇺🇸 美国", "🇸🇬 新加坡", "🇯🇵 日本", "🇹🇼 台湾", "🎯 节点选择"]
    include-all: true
    filter: *FilterDoro_ISP

  - name: "🤖 GPT 服务"
    type: select
    proxies: ["🇺🇸 美国", "🇸🇬 新加坡", "🇯🇵 日本", "🇹🇼 台湾", "🎯 节点选择"]
    include-all: true
    filter: *FilterDoro_ISP

  - name: "🤖 Gemini 服务"
    type: select
    proxies: ["🇺🇸 美国", "🇸🇬 新加坡", "🇯🇵 日本", "🇹🇼 台湾", "🎯 节点选择"]
    include-all: true
    filter: *FilterDoro_ISP

  - name: "🤖 AI 服务"
    type: select
    proxies: ["🇺🇸 美国", "🇸🇬 新加坡", "🇯🇵 日本", "🇹🇼 台湾", "🎯 节点选择"]
    include-all: true
    filter: *FilterDoro_ISP

  - name: "📹 流媒体"
    type: select
    proxies: ["🇭🇰 香港", "🇸🇬 新加坡", "🇯🇵 日本", "🇺🇸 美国", "🇹🇼 台湾", "🇰🇷 韩国", "🎯 节点选择"]
    include-all: true
    filter: *FilterDoro_Hosting

  - name: "✈️ 电报消息"
    type: select
    proxies: ["🇭🇰 香港", "🇸🇬 新加坡", "🇯🇵 日本", "🇺🇸 美国", "🇹🇼 台湾", "🇰🇷 韩国", "🎯 节点选择"]
    include-all: true
    filter: *FilterDoro_Hosting

  - name: "🍎 苹果服务"
    type: select
    proxies: [DIRECT, "🇭🇰 香港", "🇸🇬 新加坡", "🇯🇵 日本", "🇺🇸 美国", "🇹🇼 台湾", "🇰🇷 韩国", "🎯 节点选择"]

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies: [DIRECT, "🇭🇰 香港", "🇸🇬 新加坡", "🇯🇵 日本", "🇺🇸 美国", "🇹🇼 台湾", "🇰🇷 韩国", "🎯 节点选择"]

  - name: "🛡️ 广告拦截"
    type: select
    proxies: [REJECT, DIRECT]     # REJECT = 直接拦截；REJECT-DROP = 静默丢弃

  - name: "🐟 漏网之鱼"
    type: select
    proxies: ["🇭🇰 香港", "🇸🇬 新加坡", "🇯🇵 日本", "🇺🇸 美国", "🇹🇼 台湾", "🇰🇷 韩国", "🎯 节点选择"]

  # ── 地区手动选择 ──────────────
  - { name: "🇭🇰 香港",   <<: *g_select,  filter: *FilterHK }
  - { name: "🇸🇬 新加坡", <<: *g_select,  filter: *FilterSG }
  - { name: "🇯🇵 日本",   <<: *g_select,  filter: *FilterJP }
  - { name: "🇺🇸 美国",   <<: *g_select,  filter: *FilterUS }
  - { name: "🇰🇷 韩国",   <<: *g_select,  filter: *FilterKR }
  - { name: "🇹🇼 台湾",   <<: *g_select,  filter: *FilterTW }

# ── 规则集提供者 ──────────────────────────────────────────────────
rule-providers:

  # 广告拦截 ────────────────────────────────────────
  reject_non_ip:
    <<: *rs_classical
    url: "https://ruleset.skk.moe/Clash/non_ip/reject.txt"
    path: ./rule_set/reject_non_ip.txt

  reject_non_ip_drop:
    <<: *rs_classical
    url: "https://ruleset.skk.moe/Clash/non_ip/reject-drop.txt"
    path: ./rule_set/reject_non_ip_drop.txt

  reject_domainset:
    <<: *rs_domain
    url: "https://ruleset.skk.moe/Clash/domainset/reject.txt"
    path: ./rule_set/reject_domainset.txt

  # ── AI 服务(域名) ─────────────────────────────────────────
  ai_anthropic:
    <<: *rs_classical_yaml
    url: "https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/anthropic.yaml"
