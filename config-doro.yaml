    url: "https://ruleset.skk.moe/Clash/ip/china_ip.txt"
    path: ./rule_set/china_ip.txt

# ── 路由规则(精准分流) ──────────────────────────────────────────────────
rules:
  # ════ 域名类规则 ════════════════════════════════════════════
  # 广告拦截（最优先）
  - RULE-SET,reject_non_ip,🛡️ 广告拦截
  - RULE-SET,reject_domainset,🛡️ 广告拦截
  - RULE-SET,reject_non_ip_drop,REJECT-DROP   # 静默丢弃，防止某些探测

  # WebRTC / STUN / TURN 拦截
  - DOMAIN-KEYWORD,stun,REJECT
  - DOMAIN-KEYWORD,turn,REJECT
  - DST-PORT,3478,REJECT
  - DST-PORT,5349,REJECT
  - DST-PORT,19302,REJECT

  # AI 服务
  - RULE-SET,ai_anthropic,🤖 Claude 服务
  - RULE-SET,ai_openai,🤖 GPT 服务
  - RULE-SET,ai_googleai,🤖 Gemini 服务
  - RULE-SET,ai_cn,DIRECT   # 汇总所有中国 AI 服务
  - RULE-SET,ai_global,🤖 AI 服务   # 汇总所有海外 AI 服务

  # 电报
  - RULE-SET,telegram_non_ip,✈️ 电报消息

